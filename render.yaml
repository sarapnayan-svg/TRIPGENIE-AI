services:
  # ----------------------------------------------------------------------------
  # TripGenie AI — Unified Full-Stack Service (React 19 + FastAPI + RAG)
  # Serves both the React Single Page App at / and the FastAPI Backend at /api
  # Single link, zero CORS errors, complete end-to-end functionality
  # ----------------------------------------------------------------------------
  - type: web
    name: tripgenie-ai
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./tripgenie.db
